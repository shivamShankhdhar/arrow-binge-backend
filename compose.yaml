services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: arrow_binge
      POSTGRES_USER: arrow_binge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrow_binge"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
