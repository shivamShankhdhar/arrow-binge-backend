spring.application.name=arrow-binge-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/arrow_binge}
spring.datasource.username=${DB_USERNAME:arrow_binge}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=262144
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
app.google-client-id=${GOOGLE_WEB_CLIENT_ID:}
app.session-secret=${SESSION_SECRET:}
app.allowed-google-client-ids=${GOOGLE_ANDROID_CLIENT_IDS:}
app.public-url=${PUBLIC_URL:http://localhost:8080}
